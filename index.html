<!DOCTYPE html>
<html lang="en">
<head>

<!--
  ===========================================================================
  SETUP
  ===========================================================================

  Each choir gets its own Drive folder. Inside it, one folder per song.
  Inside those, the tracks.

      JH Boys/                          <- one of the five folders below
          My Tribute/
              88395_sopranotrack.mp3
              88395_altotrack.mp3
              Vocals - Choir.wav
          Revelation 19:1/
              ...

  File names don't need cleaning up. The page looks inside each name for a
  part word — soprano, alto, tenor, baritone, bass, cambiata, choir, piano,
  accompaniment — and labels the player from that, ignoring catalog numbers
  and anything else. Files it can't place still appear, with a tidied name.

  TO ADD A FOLDER: open it in Drive, copy the part of the address after
  /folders/, and paste it below in place of PASTE_ID. Share each folder
  "Anyone with the link, viewer" or the page can't read it.

  The word "divider" in the list draws the dividing line in the choir bar.
  Move it, remove it, or add choirs above or below it as you like.
  ===========================================================================
-->

<script>
const API_KEY = "AIzaSyCCCtx1hWXM4ithbv8dYZQY_GyfKatE26E";

const GROUPS = [
  { name: "JH Boys",       folderId: "1K6_B8YQarJKDWJ6aw95hYiK7aoBKEaiInWhMNUU1GSoO8wyVtG7-SwYtWlEU5-Qk4JWQoNVV" },
  { name: "JH Girls",      folderId: "1sRCKrMjJ1UXuWsFPmVFc6VTojycFbczYUUq4qHFLBowQqIozf_IwHcJ0tJfawWYRUH924Uf-" },
  { name: "Warrior Choir", folderId: "1fmLxRSVU2UWr9PwrDSQHRdfFH0fNsdaC" },
  "divider",
  { name: "JH All-Region", folderId: "1C9nZ2216nUR_VqRaNOY9cQN_Y2NWxAwC" },
  { name: "HS All-Region", folderId: "1rTbFrRiJdcmInWmc-RzGsjvZj6Js7ZYQ" }
];
</script>

<style>
  :root {
    --cover:      #14332C;
    --cover-deep: #0E241F;
    --cover-line: #2E5348;
    --page:       #FFFFFF;
    --ink:        #16191A;
    --ink-soft:   #5C6360;
    --rule:       #E4E2DB;
    --quiet:      #93AAA3;

    --part-s:     #0E6E7F;
    --part-a:     #9B2F55;
    --part-t:     #3D51A3;
    --part-c:     #6B4E9E;
    --part-br:    #8A4A7D;
    --part-bs:    #1F4E79;
    --part-all:   #465250;
    --part-piano: #7A7168;

    --serif: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--cover);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-text-size-adjust: 100%;
  }

  body { min-height: 100vh; padding: 0 0 3rem; }

  /* ---------- masthead ---------- */

  .masthead {
    background: var(--cover-deep);
    padding: 1.5rem 1.5rem 0;
    border-bottom: 1px solid var(--cover-line);
  }

  .masthead h1 {
    font-family: var(--serif);
    font-size: 1.35rem;
    font-weight: normal;
    letter-spacing: 0.05em;
    color: #F3F1EC;
    margin: 0;
  }

  .masthead p {
    margin: 0.35rem 0 0;
    font-size: 0.9rem;
    color: var(--quiet);
  }

  /* ---------- choir bar ---------- */

  .groups {
    display: flex;
    align-items: stretch;
    gap: 0.4rem;
    margin-top: 1.1rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .groups::-webkit-scrollbar { display: none; }

  .group-btn {
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 0.95rem;
    white-space: nowrap;
    color: #DDE6E2;
    background: transparent;
    border: 1px solid var(--cover-line);
    border-bottom: none;
    border-radius: 3px 3px 0 0;
    padding: 0.7rem 1rem;
    min-height: 44px;
    cursor: pointer;
  }

  .group-btn:hover { background: var(--cover-line); }

  .group-btn[aria-current="true"] {
    background: var(--cover);
    border-color: var(--cover);
    color: #FFFFFF;
    font-weight: 600;
  }

  .group-btn[data-unset="true"] { color: #6C8880; }

  .group-btn:focus-visible { outline: 2px solid #F3F1EC; outline-offset: -3px; }

  .group-divider {
    flex: 0 0 auto;
    width: 1px;
    background: var(--cover-line);
    margin: 0.4rem 0.6rem 0;
  }

  /* ---------- shell ---------- */

  .shell {
    max-width: 1100px; margin: 0 auto;
    padding: 1.5rem 1rem 0;
    display: grid; grid-template-columns: 230px 1fr;
    gap: 1.5rem; align-items: start;
  }

  .rail h2 {
    font-size: 0.85rem; font-weight: 600;
    color: var(--quiet); margin: 0 0 0.6rem 0.2rem;
  }

  .rail-list { list-style: none; margin: 0; padding: 0; }
  .rail-list li { margin-bottom: 0.35rem; }

  .rail-btn {
    display: block; width: 100%; text-align: left;
    font-family: var(--serif); font-size: 1.05rem; line-height: 1.3;
    color: #DDE6E2; background: transparent;
    border: 1px solid transparent; border-radius: 3px;
    padding: 0.7rem 0.8rem; min-height: 44px; cursor: pointer;
  }

  .rail-btn:hover { background: var(--cover-line); }

  .rail-btn[aria-current="true"] {
    background: var(--page); color: var(--ink); border-color: var(--page);
  }

  .rail-btn:focus-visible { outline: 2px solid #F3F1EC; outline-offset: 2px; }

  .rail-note { font-size: 0.85rem; color: var(--quiet); margin: 0 0 0 0.2rem; }

  /* ---------- open song ---------- */

  .sheet {
    background: var(--page); border-radius: 3px;
    padding: 1.6rem 1.5rem 1.8rem;
  }

  .sheet-title {
    font-family: var(--serif); font-size: 1.9rem; font-weight: normal;
    margin: 0 0 0.15rem; line-height: 1.15;
  }

  .sheet-sub { margin: 0 0 1.3rem; font-size: 0.9rem; color: var(--ink-soft); }

  .settings {
    display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: center;
    padding: 0.85rem 0;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    margin-bottom: 1.4rem;
  }

  .setting { display: flex; align-items: center; gap: 0.55rem; }
  .setting-label { font-size: 0.9rem; color: var(--ink-soft); }
  .speeds { display: flex; gap: 0.3rem; }

  .speed-btn, .repeat-btn {
    font-family: var(--sans); font-size: 0.9rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.5rem 0.75rem; min-height: 44px; min-width: 48px; cursor: pointer;
  }

  .speed-btn:hover, .repeat-btn:hover { border-color: var(--ink-soft); }

  .speed-btn[aria-pressed="true"], .repeat-btn[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: #FFF;
  }

  .speed-btn:focus-visible, .repeat-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  .part {
    display: grid; grid-template-columns: 62px 1fr; gap: 1rem;
    align-items: center; padding: 0.9rem 0;
    border-bottom: 1px solid var(--rule);
  }

  .part:last-child { border-bottom: 0; }

  .part-mark {
    font-family: var(--serif); font-size: 1.9rem; line-height: 1;
    text-align: center; padding: 0.55rem 0;
    border: 1px solid currentColor; border-radius: 2px;
  }

  .part-body { min-width: 0; }
  .part-name { font-size: 0.95rem; font-weight: 600; margin: 0 0 0.45rem; }
  .part audio { width: 100%; height: 40px; display: block; }

  .msg {
    font-size: 0.95rem; color: var(--ink-soft);
    line-height: 1.55; margin: 0 0 0.6rem; max-width: 62ch;
  }

  .msg strong { color: var(--ink); font-weight: 600; }
  .msg-list { margin: 0.4rem 0 0; padding-left: 1.2rem; }
  .msg-list li { margin-bottom: 0.3rem; }
  .part-missing { font-size: 0.85rem; color: var(--ink-soft); margin: 0; padding: 0.6rem 0; }

  /* ---------- narrow screens ---------- */

  @media (max-width: 760px) {
    .masthead { padding: 1.2rem 1rem 0; }
    .masthead h1 { font-size: 1.1rem; }

    .shell { grid-template-columns: 1fr; gap: 1rem; padding: 1rem 0.75rem 0; }

    .rail-list {
      display: flex; gap: 0.4rem; overflow-x: auto;
      padding-bottom: 0.4rem; -webkit-overflow-scrolling: touch;
    }
    .rail-list li { margin-bottom: 0; flex: 0 0 auto; }
    .rail-btn { white-space: nowrap; }

    .sheet { padding: 1.2rem 1rem 1.4rem; }
    .sheet-title { font-size: 1.6rem; }
    .part { grid-template-columns: 52px 1fr; gap: 0.8rem; }
    .part-mark { font-size: 1.6rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>

<header class="masthead">
  <h1>LRCA CHOIR PRACTICE TRACKS</h1>
  <p>Pick your choir, then your song</p>
  <nav class="groups" id="groups" aria-label="Choirs"></nav>
</header>

<div class="shell">
  <nav class="rail" aria-label="Songs">
    <h2>Songs</h2>
    <ul class="rail-list" id="rail"></ul>
    <p class="rail-note" id="railNote"></p>
  </nav>

  <main class="sheet" id="sheet" aria-live="polite"></main>
</div>

<script>
(function () {
  "use strict";

  var API = "https://www.googleapis.com/drive/v3/files";
  var FOLDER_MIME = "application/vnd.google-apps.folder";

  /* Voices, checked in this order. Each pattern allows the voice word to run
     straight into other text — "88395_sopranotrack.mp3" still reads as
     Soprano — but requires it to start a word so "alternate" isn't an Alto. */
  var VOICES = [
    { name: "Soprano",  mark: "S",  color: "var(--part-s)",
      re: /(?:^|\s)(?:soprano|descant)|(?:^|\s)sopr?(?=[\s\d]|$)/i },
    { name: "Alto",     mark: "A",  color: "var(--part-a)",
      re: /(?:^|\s)alto|(?:^|\s)alt(?=[\s\d]|$)/i },
    { name: "Tenor",    mark: "T",  color: "var(--part-t)",
      re: /(?:^|\s)tenor|(?:^|\s)ten(?=[\s\d]|$)/i },
    { name: "Cambiata", mark: "C",  color: "var(--part-c)",
      re: /(?:^|\s)cambiata|(?:^|\s)camb(?=[\s\d]|$)/i },
    { name: "Baritone", mark: "Br", color: "var(--part-br)",
      re: /(?:^|\s)bariton|(?:^|\s)bari(?=[\s\d]|$)/i },
    { name: "Bass",     mark: "B",  color: "var(--part-bs)",
      re: /(?:^|\s)bass|(?:^|\s)bas(?=[\s\d]|$)/i }
  ];

  /* Anything that isn't a single voice part. */
  var GROUPED = [
    { name: "Everyone",   mark: "\u266B", color: "var(--part-all)",
      re: /(?:^|\s)(?:balanced|choir|chorus|full|everyone|all\s*parts|tutti|satb|sab|ssaa?)/i },
    { name: "Accompaniment", mark: "\u266A", color: "var(--part-piano)",
      re: /(?:^|\s)accomp/i },
    { name: "Piano only", mark: "\u266A", color: "var(--part-piano)",
      re: /(?:^|\s)(?:piano|instrument|backing|karaoke|demo)/i }
  ];

  var groupsBar = document.getElementById("groups");
  var rail = document.getElementById("rail");
  var railNote = document.getElementById("railNote");
  var sheet = document.getElementById("sheet");

  var choirs = GROUPS.filter(function (g) { return g !== "divider"; });

  var groupIndex = -1;
  var songs = [];
  var songIndex = -1;
  var songCache = {};
  var partCache = {};
  var speed = 1;
  var repeat = false;

  /* ---------- helpers ---------- */

  function isUnset(choir) {
    return !choir.folderId || choir.folderId.indexOf("PASTE") === 0;
  }

  /* 1 / 2 / 3, however it's written. */
  function divisionValue(token) {
    var t = token.toLowerCase();
    if (t === "1" || t === "i"   || t === "1st" || t === "first")  { return "1"; }
    if (t === "2" || t === "ii"  || t === "2nd" || t === "second") { return "2"; }
    if (t === "3" || t === "iii" || t === "3rd" || t === "third")  { return "3"; }
    return "";
  }

  /* Looks just after the voice word for "1", "2", "I", "II" — and if that
     turns up nothing, just before it for "1st", "Second" and the like. */
  function divisionNear(text, endOfVoice, beforeVoice) {
    var after = text.slice(endOfVoice, endOfVoice + 8);
    var m = after.match(/^\s*(?:no\.?\s*)?(1|2|3|i{1,3})(?![a-z0-9])/i);
    if (m) { return divisionValue(m[1]); }

    m = beforeVoice.match(/(1st|2nd|3rd|first|second|third|1|2|3)\s*$/i);
    if (m) { return divisionValue(m[1]); }

    return "";
  }

  function tidyName(fileName) {
    var base = fileName.replace(/\.[^.]+$/, "");
    var cut = base.lastIndexOf(" - ");
    if (cut !== -1) { return base.slice(cut + 3).trim(); }

    base = base.replace(/^[\d\s_\-]+/, "")
               .replace(/[_\-]+/g, " ")
               .replace(/\btrack\b/ig, "")
               .replace(/\s+/g, " ")
               .trim();

    if (!base) { return fileName; }
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function describePart(id, fileName) {
    /* Underscores, hyphens and dots all become spaces so separators stop
       mattering: soprano_1, Soprano-1 and "Soprano 1" all read the same. */
    var text = " " + fileName.replace(/\.[^.]+$/, "").replace(/[_\-.]+/g, " ") + " ";

    for (var i = 0; i < VOICES.length; i++) {
      var m = text.match(VOICES[i].re);
      if (m) {
        var v = VOICES[i];
        var div = divisionNear(text, m.index + m[0].length, text.slice(0, m.index));
        return {
          id: id,
          name: div ? v.name + " " + div : v.name,
          mark: div ? v.mark + div : v.mark,
          color: v.color,
          order: i * 10 + (div ? Number(div) : 0)
        };
      }
    }

    for (var j = 0; j < GROUPED.length; j++) {
      if (GROUPED[j].re.test(text)) {
        return {
          id: id, name: GROUPED[j].name, mark: GROUPED[j].mark,
          color: GROUPED[j].color, order: 100 + j
        };
      }
    }

    return {
      id: id, name: tidyName(fileName), mark: "\u266A",
      color: "var(--part-all)", order: 200
    };
  }

  function mediaUrl(id) {
    return API + "/" + encodeURIComponent(id) + "?alt=media&key=" + encodeURIComponent(API_KEY);
  }

  function listFolder(id, foldersOnly) {
    var q = "'" + id + "' in parents and trashed=false";
    if (foldersOnly) { q += " and mimeType='" + FOLDER_MIME + "'"; }
    var url = API +
      "?q=" + encodeURIComponent(q) +
      "&fields=" + encodeURIComponent("files(id,name,mimeType)") +
      "&orderBy=name&pageSize=200&key=" + encodeURIComponent(API_KEY);

    return fetch(url).then(function (res) {
      if (!res.ok) { throw new Error("Drive returned " + res.status); }
      return res.json();
    }).then(function (data) { return data.files || []; });
  }

  /* ---------- messages ---------- */

  function showLoading(text) {
    sheet.innerHTML = "";
    var p = document.createElement("p");
    p.className = "msg";
    p.textContent = text;
    sheet.appendChild(p);
  }

  function showMessage(headline, points) {
    sheet.innerHTML = "";
    var p = document.createElement("p");
    p.className = "msg";
    var strong = document.createElement("strong");
    strong.textContent = headline;
    p.appendChild(strong);
    sheet.appendChild(p);

    if (points && points.length) {
      var ul = document.createElement("ul");
      ul.className = "msg-list msg";
      points.forEach(function (t) {
        var li = document.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      sheet.appendChild(ul);
    }
  }

  /* ---------- settings ---------- */

  function applySettings() {
    var players = sheet.querySelectorAll("audio");
    for (var i = 0; i < players.length; i++) {
      players[i].playbackRate = speed;
      players[i].loop = repeat;
    }
  }

  function makeSettings() {
    var wrap = document.createElement("div");
    wrap.className = "settings";

    var speedSetting = document.createElement("div");
    speedSetting.className = "setting";

    var label = document.createElement("span");
    label.className = "setting-label";
    label.textContent = "Speed";
    speedSetting.appendChild(label);

    var speeds = document.createElement("div");
    speeds.className = "speeds";

    [[1, "Normal"], [0.85, "Slower"], [0.7, "Slowest"]].forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "speed-btn";
      b.type = "button";
      b.textContent = opt[1];
      b.setAttribute("aria-pressed", speed === opt[0] ? "true" : "false");
      b.addEventListener("click", function () {
        speed = opt[0];
        var all = speeds.querySelectorAll(".speed-btn");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
        }
        applySettings();
      });
      speeds.appendChild(b);
    });

    speedSetting.appendChild(speeds);
    wrap.appendChild(speedSetting);

    var repeatSetting = document.createElement("div");
    repeatSetting.className = "setting";

    var repeatBtn = document.createElement("button");
    repeatBtn.className = "repeat-btn";
    repeatBtn.type = "button";
    repeatBtn.textContent = "Repeat";
    repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
    repeatBtn.addEventListener("click", function () {
      repeat = !repeat;
      repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
      applySettings();
    });

    repeatSetting.appendChild(repeatBtn);
    wrap.appendChild(repeatSetting);

    return wrap;
  }

  /* ---------- parts ---------- */

  function makePart(part) {
    var row = document.createElement("div");
    row.className = "part";

    var mark = document.createElement("div");
    mark.className = "part-mark";
    mark.style.color = part.color;
    mark.textContent = part.mark;
    mark.setAttribute("aria-hidden", "true");
    row.appendChild(mark);

    var body = document.createElement("div");
    body.className = "part-body";

    var name = document.createElement("p");
    name.className = "part-name";
    name.textContent = part.name;
    body.appendChild(name);

    var audio = document.createElement("audio");
    audio.setAttribute("controls", "");
    audio.setAttribute("preload", "none");
    audio.src = mediaUrl(part.id);

    audio.addEventListener("play", function () {
      var others = sheet.querySelectorAll("audio");
      for (var i = 0; i < others.length; i++) {
        if (others[i] !== audio) { others[i].pause(); }
      }
      audio.playbackRate = speed;
      audio.loop = repeat;
    });

    audio.addEventListener("loadedmetadata", function () {
      audio.playbackRate = speed;
    });

    audio.addEventListener("error", function () {
      var note = document.createElement("p");
      note.className = "part-missing";
      note.textContent = "This track wouldn't play. Check that it's shared with the rest of the folder.";
      if (audio.parentNode) { audio.parentNode.replaceChild(note, audio); }
    });

    body.appendChild(audio);
    row.appendChild(body);
    return row;
  }

  /* ---------- song view ---------- */

  function paintSong(song, parts) {
    sheet.innerHTML = "";

    var title = document.createElement("h2");
    title.className = "sheet-title";
    title.textContent = song.name;
    sheet.appendChild(title);

    var sub = document.createElement("p");
    sub.className = "sheet-sub";
    sub.textContent = parts.length === 1 ? "1 track" : parts.length + " tracks";
    sheet.appendChild(sub);

    if (!parts.length) {
      var empty = document.createElement("p");
      empty.className = "msg";
      empty.textContent = "Nothing in this folder yet. Drop the tracks into it and reload.";
      sheet.appendChild(empty);
      return;
    }

    sheet.appendChild(makeSettings());

    var wrap = document.createElement("div");
    parts.forEach(function (part) { wrap.appendChild(makePart(part)); });
    sheet.appendChild(wrap);
  }

  function selectSong(i) {
    songIndex = i;
    var btns = rail.querySelectorAll(".rail-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-current", j === i ? "true" : "false");
    }

    var song = songs[i];
    if (partCache[song.id]) { paintSong(song, partCache[song.id]); return; }

    showLoading("Loading " + song.name + "\u2026");

    listFolder(song.id, false).then(function (files) {
      var parts = files.filter(function (f) {
        return f.mimeType && f.mimeType.indexOf("audio") === 0;
      }).map(function (f) {
        return describePart(f.id, f.name);
      }).sort(function (a, b) {
        var d = a.order - b.order;
        return d !== 0 ? d : a.name.localeCompare(b.name);
      });

      partCache[song.id] = parts;
      if (songIndex === i) { paintSong(song, parts); }
    }).catch(function () {
      showMessage("Couldn't open this song's folder.", [
        "Make sure it's still shared with anyone who has the link.",
        "Reload the page and try again."
      ]);
    });
  }

  /* ---------- choir view ---------- */

  function paintRail() {
    rail.innerHTML = "";
    songs.forEach(function (song, i) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.className = "rail-btn";
      btn.type = "button";
      btn.textContent = song.name;
      btn.setAttribute("aria-current", "false");
      btn.addEventListener("click", function () { selectSong(i); });
      li.appendChild(btn);
      rail.appendChild(li);
    });
  }

  function selectGroup(i) {
    groupIndex = i;
    songs = [];
    songIndex = -1;
    rail.innerHTML = "";

    var btns = groupsBar.querySelectorAll(".group-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-current", j === i ? "true" : "false");
    }

    var choir = choirs[i];

    if (isUnset(choir)) {
      railNote.textContent = "";
      showMessage(choir.name + " isn't connected yet.", [
        "Open that choir's folder in Drive and copy the part of the address after /folders/.",
        "Paste it into the GROUPS list at the top of this file, in place of PASTE_ID.",
        "Make sure the folder is shared with anyone who has the link."
      ]);
      return;
    }

    if (songCache[choir.folderId]) {
      songs = songCache[choir.folderId];
      finishGroup(choir);
      return;
    }

    railNote.textContent = "Loading\u2026";
    showLoading("Looking for " + choir.name + " songs\u2026");

    listFolder(choir.folderId, true).then(function (folders) {
      if (groupIndex !== i) { return; }
      songCache[choir.folderId] = folders;
      songs = folders;
      finishGroup(choir);
    }).catch(function () {
      if (groupIndex !== i) { return; }
      railNote.textContent = "Couldn't connect";
      showMessage("Couldn't reach the " + choir.name + " folder.", [
        "Check the folder is shared with anyone who has the link, not just your school.",
        "Check the folder ID matches what's in the Drive address bar.",
        "Check the API key is active and has the Drive API turned on.",
        "If the key is restricted by website, make sure this page's address is on the list."
      ]);
    });
  }

  function finishGroup(choir) {
    if (!songs.length) {
      railNote.textContent = "No songs yet";
      showMessage("The " + choir.name + " folder is reachable, but there are no song folders inside it.", [
        "Make one folder per song, then put that song's tracks inside it."
      ]);
      return;
    }

    railNote.textContent = "";
    paintRail();
    selectSong(0);
  }

  /* ---------- choir bar ---------- */

  function buildGroupBar() {
    var index = 0;
    GROUPS.forEach(function (entry) {
      if (entry === "divider") {
        var rule = document.createElement("span");
        rule.className = "group-divider";
        rule.setAttribute("aria-hidden", "true");
        groupsBar.appendChild(rule);
        return;
      }

      var i = index++;
      var btn = document.createElement("button");
      btn.className = "group-btn";
      btn.type = "button";
      btn.textContent = entry.name;
      btn.setAttribute("aria-current", "false");
      if (isUnset(entry)) { btn.setAttribute("data-unset", "true"); }
      btn.addEventListener("click", function () { selectGroup(i); });
      groupsBar.appendChild(btn);
    });
  }

  /* ---------- start ---------- */

  buildGroupBar();

  var first = 0;
  for (var i = 0; i < choirs.length; i++) {
    if (!isUnset(choirs[i])) { first = i; break; }
  }
  selectGroup(first);
})();
</script>

</body>
</html>
