<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LRCA Choir Practice Tracks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Choir Tracks">

<!--
  Reads manifest.json, which the Drive sync writes. Nothing to configure here.
  To add or remove a choir, edit folders.json and re-run the sync.

  The waveforms come from the sync too — it measures each track once on
  GitHub's machines so browsers never have to decode audio. A track with no
  waveform yet just shows a plain bar instead.
-->

<style>
  :root {
    --cover:      #14332C;
    --cover-deep: #0E241F;
    --cover-line: #2E5348;
    --page:       #FFFFFF;
    --ink:        #16191A;
    --ink-soft:   #5C6360;
    --ink-faint:  #8B918E;
    --rule:       #E4E2DB;
    --quiet:      #93AAA3;
    --accent:     #0E6E7F;
    --band:       #2F5AD0;
    --band-soft:  rgba(47, 90, 208, 0.15);

    --serif: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--cover); color: var(--ink);
    font-family: var(--sans); -webkit-text-size-adjust: 100%;
  }

  body { min-height: 100vh; padding: 0 0 4rem; }

  .masthead {
    background: var(--cover-deep);
    padding: 1.4rem 1.5rem 0;
    border-bottom: 1px solid var(--cover-line);
  }

  .masthead h1 {
    font-family: var(--serif); font-size: 1.3rem; font-weight: normal;
    letter-spacing: 0.05em; color: #F3F1EC; margin: 0;
  }

  .groups {
    display: flex; align-items: stretch; gap: 0.4rem;
    margin-top: 1.1rem; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }

  .groups::-webkit-scrollbar { display: none; }

  .group-btn {
    flex: 0 0 auto;
    font-family: var(--sans); font-size: 0.95rem; white-space: nowrap;
    color: #DDE6E2; background: transparent;
    border: 1px solid var(--cover-line); border-bottom: none;
    border-radius: 3px 3px 0 0;
    padding: 0.7rem 1rem; min-height: 44px; cursor: pointer;
  }

  .group-btn:hover { background: var(--cover-line); }

  .group-btn[aria-current="true"] {
    background: var(--page); border-color: var(--page);
    color: var(--ink); font-weight: 600;
  }

  .group-btn:focus-visible { outline: 2px solid #F3F1EC; outline-offset: -3px; }

  .group-divider {
    flex: 0 0 auto; width: 1px;
    background: var(--cover-line); margin: 0.4rem 0.6rem 0;
  }

  .shell { max-width: 760px; margin: 0 auto; padding: 0 1rem; }

  .crumbs {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.3rem; padding: 1rem 0.2rem; font-size: 0.9rem;
  }

  .crumb {
    font-family: var(--sans); font-size: 0.9rem;
    color: #DDE6E2; background: transparent; border: 0;
    padding: 0.3rem 0.1rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .crumb:disabled { text-decoration: none; color: var(--quiet); cursor: default; }
  .crumb:focus-visible { outline: 2px solid #F3F1EC; outline-offset: 2px; }
  .crumb-sep { color: var(--cover-line); }

  .panel { background: var(--page); border-radius: 3px; padding: 0.4rem 1.4rem 1.2rem; }

  .row { border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: 0; }

  .row-folder {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; width: 100%;
    background: transparent; border: 0; cursor: pointer;
    font-family: var(--serif); font-size: 1.2rem; color: var(--ink);
    text-align: left; padding: 1.05rem 0.2rem; min-height: 56px;
  }

  .row-folder:hover { color: var(--accent); }
  .row-folder:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .row-chevron { color: var(--ink-faint); font-size: 1.3rem; flex: 0 0 auto; }

  .row-file { padding: 0.95rem 0.2rem 1.1rem; }

  .file-name {
    font-size: 0.95rem; color: var(--ink);
    margin: 0 0 0.6rem; word-break: break-word;
  }

  /* ---------- player ---------- */

  .player { display: flex; align-items: center; gap: 0.75rem; }

  .play-btn {
    flex: 0 0 auto; width: 46px; height: 46px;
    display: flex; align-items: center; justify-content: center;
    background: var(--ink); color: #FFFFFF;
    border: 0; border-radius: 50%; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 0;
  }

  .play-btn:hover { background: var(--accent); }
  .play-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .play-btn svg { width: 16px; height: 16px; fill: currentColor; display: block; }

  .timeline-wrap { flex: 1; min-width: 0; }

  .timeline {
    position: relative; height: 58px; cursor: pointer;
    touch-action: none; -webkit-user-select: none; user-select: none;
  }

  .timeline:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Plain bar, shown only when a track has no waveform yet. */
  .timeline.plain::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 6px; margin-top: -3px; background: var(--rule); border-radius: 3px;
  }

  .wave {
    position: absolute; inset: 0; z-index: 0;
    width: 100%; height: 100%; display: block;
  }

  .played {
    position: absolute; left: 0; top: 50%; height: 6px; margin-top: -3px;
    background: var(--ink-faint); border-radius: 3px; width: 0;
    z-index: 1; display: none;
  }

  .timeline.plain .played { display: block; }

  .band {
    position: absolute; top: 4px; bottom: 4px; z-index: 2;
    background: var(--band-soft);
    border-left: 2px solid var(--band); border-right: 2px solid var(--band);
    display: none; pointer-events: none;
  }

  .band.on { display: block; }

  .handle {
    position: absolute; top: 0; height: 100%; width: 34px; z-index: 3;
    margin-left: -17px; background: transparent; border: 0; padding: 0;
    cursor: grab; touch-action: none; display: none;
  }

  .handle.on { display: block; }
  .handle:active { cursor: grabbing; }

  .handle::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 12px; height: 30px; margin: -15px 0 0 -6px;
    background: var(--band); border-radius: 3px;
    border: 2px solid var(--page);
  }

  .handle:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  /* Above the handles, with a light halo so it stays readable over them. */
  .playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; z-index: 4;
    background: var(--ink); left: 0; pointer-events: none;
    box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.9);
  }

  .under {
    display: flex; align-items: center; justify-content: space-between;
    gap: 0.75rem; margin-top: 0.2rem;
  }

  .times {
    font-size: 0.8rem; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; margin: 0;
  }

  .band-times { color: var(--band); font-weight: 600; }

  .section-btn {
    font-family: var(--sans); font-size: 0.85rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.4rem 0.7rem; min-height: 38px; cursor: pointer; white-space: nowrap;
  }

  .section-btn:hover { border-color: var(--ink-soft); }

  .section-btn[aria-pressed="true"] {
    background: var(--band); border-color: var(--band); color: #FFFFFF;
  }

  .section-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .section-btn:disabled { opacity: 0.45; cursor: default; }

  /* ---------- speed and repeat ---------- */

  .settings {
    display: flex; flex-wrap: wrap; gap: 1.4rem; align-items: center;
    padding: 0.9rem 0.2rem; border-bottom: 1px solid var(--rule);
  }

  .setting { display: flex; align-items: center; gap: 0.5rem; }
  .setting-label { font-size: 0.9rem; color: var(--ink-soft); }
  .speeds { display: flex; gap: 0.3rem; }

  .speed-btn, .repeat-btn {
    font-family: var(--sans); font-size: 0.9rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.5rem 0.75rem; min-height: 44px; min-width: 48px; cursor: pointer;
  }

  .speed-btn:hover, .repeat-btn:hover { border-color: var(--ink-soft); }

  .speed-btn[aria-pressed="true"], .repeat-btn[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: #FFF;
  }

  .speed-btn:focus-visible, .repeat-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  .open-btn {
    font-family: var(--sans); font-size: 0.9rem;
    color: var(--accent); background: transparent;
    border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.55rem 0.9rem; min-height: 44px; cursor: pointer;
  }

  .open-btn:hover { border-color: var(--accent); }
  .open-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .msg {
    font-size: 0.95rem; color: var(--ink-soft); line-height: 1.55;
    margin: 0 0 0.6rem; padding: 0.8rem 0.2rem 0; max-width: 62ch;
  }

  .msg strong { color: var(--ink); font-weight: 600; }
  .msg-list { margin: 0.2rem 0 0.8rem; padding-left: 1.4rem; }
  .msg-list li { margin-bottom: 0.3rem; }

  .stamp {
    font-size: 0.8rem; color: var(--quiet);
    text-align: center; padding: 1.2rem 0 0; margin: 0;
  }

  .viewer {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 20, 17, 0.94);
    display: flex; flex-direction: column;
  }

  .viewer[hidden] { display: none; }

  .viewer-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--cover-line);
  }

  .viewer-name {
    font-size: 0.95rem; color: #F3F1EC; margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .viewer-close {
    flex: 0 0 auto;
    font-family: var(--sans); font-size: 0.95rem; color: #F3F1EC;
    background: transparent; border: 1px solid var(--cover-line);
    border-radius: 3px; padding: 0.55rem 1rem; min-height: 44px; cursor: pointer;
  }

  .viewer-close:hover { background: var(--cover-line); }
  .viewer-close:focus-visible { outline: 2px solid #F3F1EC; outline-offset: 2px; }

  .viewer-body { flex: 1; overflow: auto; background: #FFFFFF; }
  .viewer-body iframe { width: 100%; height: 100%; border: 0; display: block; }
  .viewer-body img { width: 100%; height: auto; display: block; }

  @media (max-width: 700px) {
    .masthead { padding: 1.1rem 1rem 0; }
    .masthead h1 { font-size: 1.05rem; }
    .shell { padding: 0 0.75rem; }
    .panel { padding: 0.3rem 1rem 1rem; }
    .row-folder { font-size: 1.1rem; }
    .player { gap: 0.6rem; }
    .timeline { height: 52px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>

<header class="masthead">
  <h1>LRCA CHOIR PRACTICE TRACKS</h1>
  <nav class="groups" id="groups" aria-label="Choirs"></nav>
</header>

<div class="shell">
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <main class="panel" id="panel" aria-live="polite"></main>
  <p class="stamp" id="stamp"></p>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Sheet music">
  <div class="viewer-bar">
    <p class="viewer-name" id="viewerName"></p>
    <button class="viewer-close" type="button" id="viewerClose">Close</button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<script>
(function () {
  "use strict";

  var groupsBar = document.getElementById("groups");
  var crumbsBar = document.getElementById("crumbs");
  var panel = document.getElementById("panel");
  var stamp = document.getElementById("stamp");
  var viewer = document.getElementById("viewer");
  var viewerName = document.getElementById("viewerName");
  var viewerBody = document.getElementById("viewerBody");
  var viewerClose = document.getElementById("viewerClose");

  var entries = [];
  var choirs = [];
  var path = [];
  var speed = 1;
  var repeat = false;
  var players = [];

  var WAVE_QUIET = "#CDD3D0";
  var WAVE_PLAYED = "#46504D";

  var PLAY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>';
  var PAUSE_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5h4v13H3zM9 1.5h4v13H9z"/></svg>';

  function clock(seconds) {
    if (!isFinite(seconds) || seconds < 0) { return "0:00"; }
    var mins = Math.floor(seconds / 60);
    var secs = Math.floor(seconds % 60);
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
  }

  function clamp(value, low, high) {
    return Math.min(high, Math.max(low, value));
  }

  function decodePeaks(encoded) {
    if (!encoded) { return null; }
    try {
      var binary = atob(encoded);
      var out = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) { out[i] = binary.charCodeAt(i); }
      return out.length ? out : null;
    } catch (e) {
      return null;
    }
  }

  /* ---------- messages ---------- */

  function showMessage(headline, points) {
    panel.innerHTML = "";
    var p = document.createElement("p");
    p.className = "msg";
    var strong = document.createElement("strong");
    strong.textContent = headline;
    p.appendChild(strong);
    panel.appendChild(p);

    if (points && points.length) {
      var ul = document.createElement("ul");
      ul.className = "msg msg-list";
      points.forEach(function (t) {
        var li = document.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    }
  }

  /* ---------- sheet music ---------- */

  function openViewer(file) {
    viewerName.textContent = file.name;
    viewerBody.innerHTML = "";

    if (file.kind === "image") {
      var img = document.createElement("img");
      img.src = file.path;
      img.alt = file.name;
      viewerBody.appendChild(img);
    } else {
      var frame = document.createElement("iframe");
      frame.src = file.path;
      frame.title = file.name;
      viewerBody.appendChild(frame);
    }

    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    viewerClose.focus();
  }

  function closeViewer() {
    viewer.hidden = true;
    viewerBody.innerHTML = "";
    document.body.style.overflow = "";
  }

  viewerClose.addEventListener("click", closeViewer);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !viewer.hidden) { closeViewer(); }
  });

  /* ---------- speed and repeat ---------- */

  function applySettings() {
    players.forEach(function (p) { p.refresh(); });
  }

  function makeSettings() {
    var wrap = document.createElement("div");
    wrap.className = "settings";

    var speedSetting = document.createElement("div");
    speedSetting.className = "setting";

    var label = document.createElement("span");
    label.className = "setting-label";
    label.textContent = "Speed";
    speedSetting.appendChild(label);

    var speeds = document.createElement("div");
    speeds.className = "speeds";

    [[1, "Normal"], [0.85, "Slower"], [0.7, "Slowest"]].forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "speed-btn";
      b.type = "button";
      b.textContent = opt[1];
      b.setAttribute("aria-pressed", speed === opt[0] ? "true" : "false");
      b.addEventListener("click", function () {
        speed = opt[0];
        var all = speeds.querySelectorAll(".speed-btn");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
        }
        applySettings();
      });
      speeds.appendChild(b);
    });

    speedSetting.appendChild(speeds);
    wrap.appendChild(speedSetting);

    var repeatSetting = document.createElement("div");
    repeatSetting.className = "setting";

    var repeatBtn = document.createElement("button");
    repeatBtn.className = "repeat-btn";
    repeatBtn.type = "button";
    repeatBtn.textContent = "Repeat";
    repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
    repeatBtn.addEventListener("click", function () {
      repeat = !repeat;
      repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
      applySettings();
    });

    repeatSetting.appendChild(repeatBtn);
    wrap.appendChild(repeatSetting);

    return wrap;
  }

  /* ---------- rows ---------- */

  function folderRow(node) {
    var row = document.createElement("div");
    row.className = "row";

    var btn = document.createElement("button");
    btn.className = "row-folder";
    btn.type = "button";

    var name = document.createElement("span");
    name.textContent = node.name;
    btn.appendChild(name);

    var chev = document.createElement("span");
    chev.className = "row-chevron";
    chev.textContent = "\u203A";
    chev.setAttribute("aria-hidden", "true");
    btn.appendChild(chev);

    btn.addEventListener("click", function () {
      path.push(node);
      render();
    });

    row.appendChild(btn);
    return row;
  }

  function audioRow(file) {
    var peaks = decodePeaks(file.peaks);

    var row = document.createElement("div");
    row.className = "row row-file";

    var name = document.createElement("p");
    name.className = "file-name";
    name.textContent = file.name;
    row.appendChild(name);

    var audio = document.createElement("audio");
    audio.preload = "metadata";
    audio.src = file.path;

    var player = document.createElement("div");
    player.className = "player";

    var playBtn = document.createElement("button");
    playBtn.className = "play-btn";
    playBtn.type = "button";
    playBtn.innerHTML = PLAY_ICON;
    playBtn.setAttribute("aria-label", "Play " + file.name);
    player.appendChild(playBtn);

    var wrap = document.createElement("div");
    wrap.className = "timeline-wrap";

    var timeline = document.createElement("div");
    timeline.className = peaks ? "timeline" : "timeline plain";
    timeline.tabIndex = 0;
    timeline.setAttribute("role", "slider");
    timeline.setAttribute("aria-label", "Position in track");
    timeline.setAttribute("aria-valuemin", "0");

    var canvas = document.createElement("canvas");
    canvas.className = "wave";
    canvas.setAttribute("aria-hidden", "true");
    timeline.appendChild(canvas);

    var played = document.createElement("div");
    played.className = "played";
    timeline.appendChild(played);

    var band = document.createElement("div");
    band.className = "band";
    timeline.appendChild(band);

    var handleA = document.createElement("button");
    handleA.className = "handle";
    handleA.type = "button";
    handleA.setAttribute("aria-label", "Start of repeated section");
    timeline.appendChild(handleA);

    var handleB = document.createElement("button");
    handleB.className = "handle";
    handleB.type = "button";
    handleB.setAttribute("aria-label", "End of repeated section");
    timeline.appendChild(handleB);

    var head = document.createElement("div");
    head.className = "playhead";
    timeline.appendChild(head);

    wrap.appendChild(timeline);

    var under = document.createElement("div");
    under.className = "under";

    var times = document.createElement("p");
    times.className = "times";
    times.textContent = "0:00";
    under.appendChild(times);

    var sectionBtn = document.createElement("button");
    sectionBtn.className = "section-btn";
    sectionBtn.type = "button";
    sectionBtn.textContent = "Repeat part";
    sectionBtn.setAttribute("aria-pressed", "false");
    sectionBtn.disabled = true;
    under.appendChild(sectionBtn);

    wrap.appendChild(under);
    player.appendChild(wrap);
    row.appendChild(player);

    /* --- state --- */

    var duration = 0;
    var loopStart = null;
    var loopEnd = null;
    var ticking = null;
    var boxWidth = 0;

    function hasBand() { return loopStart !== null && loopEnd !== null; }

    /* --- waveform --- */

    function drawWave() {
      if (!peaks) { return; }
      var box = timeline.getBoundingClientRect();
      var w = Math.floor(box.width);
      var h = Math.floor(box.height);
      if (!w || !h) { return; }

      var ratio = window.devicePixelRatio || 1;
      if (canvas.width !== Math.floor(w * ratio) || canvas.height !== Math.floor(h * ratio)) {
        canvas.width = Math.floor(w * ratio);
        canvas.height = Math.floor(h * ratio);
      }

      var ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, w, h);

      var middle = h / 2;
      var reach = (h - 12) / 2;
      var slot = w / peaks.length;
      var barWidth = Math.max(1, slot - 0.7);
      var playedTo = duration ? (audio.currentTime / duration) * w : 0;

      for (var i = 0; i < peaks.length; i++) {
        var height = Math.max(1, (peaks[i] / 255) * reach);
        var x = i * slot;
        ctx.fillStyle = (x + slot / 2) <= playedTo ? WAVE_PLAYED : WAVE_QUIET;
        ctx.fillRect(x, middle - height, barWidth, height * 2);
      }
    }

    function drawBand() {
      if (!hasBand() || !duration) {
        band.classList.remove("on");
        handleA.classList.remove("on");
        handleB.classList.remove("on");
        return;
      }
      var a = (loopStart / duration) * 100;
      var b = (loopEnd / duration) * 100;
      band.style.left = a + "%";
      band.style.width = (b - a) + "%";
      band.classList.add("on");
      handleA.style.left = a + "%";
      handleB.style.left = b + "%";
      handleA.classList.add("on");
      handleB.classList.add("on");
    }

    function drawTime() {
      var portion = duration ? (audio.currentTime / duration) * 100 : 0;
      head.style.left = portion + "%";
      played.style.width = portion + "%";
      drawWave();

      var text = clock(audio.currentTime) + " / " + clock(duration);
      if (hasBand()) {
        text += "  \u00B7  repeating " + clock(loopStart) + "\u2013" + clock(loopEnd);
      }
      times.textContent = text;
      times.className = hasBand() ? "times band-times" : "times";
      timeline.setAttribute("aria-valuenow", Math.floor(audio.currentTime));
      timeline.setAttribute("aria-valuetext", clock(audio.currentTime));
    }

    function tick() {
      if (hasBand() && audio.currentTime >= loopEnd) {
        audio.currentTime = loopStart;
      }
      drawTime();
      ticking = requestAnimationFrame(tick);
    }

    function startTicking() {
      if (ticking === null) { ticking = requestAnimationFrame(tick); }
    }

    function stopTicking() {
      if (ticking !== null) { cancelAnimationFrame(ticking); ticking = null; }
      drawTime();
    }

    audio.addEventListener("loadedmetadata", function () {
      duration = audio.duration || 0;
      timeline.setAttribute("aria-valuemax", Math.floor(duration));
      sectionBtn.disabled = false;
      audio.playbackRate = speed;
      drawTime();
    });

    audio.addEventListener("play", function () {
      players.forEach(function (p) { if (p.audio !== audio) { p.audio.pause(); } });
      audio.playbackRate = speed;
      playBtn.innerHTML = PAUSE_ICON;
      playBtn.setAttribute("aria-label", "Pause " + file.name);
      startTicking();
    });

    audio.addEventListener("pause", function () {
      playBtn.innerHTML = PLAY_ICON;
      playBtn.setAttribute("aria-label", "Play " + file.name);
      stopTicking();
    });

    audio.addEventListener("ended", function () {
      playBtn.innerHTML = PLAY_ICON;
      stopTicking();
    });

    playBtn.addEventListener("click", function () {
      if (audio.paused) {
        var attempt = audio.play();
        if (attempt && attempt.catch) { attempt.catch(function () {}); }
      } else {
        audio.pause();
      }
    });

    /* --- dragging --- */

    function timeAt(clientX) {
      var box = timeline.getBoundingClientRect();
      if (!box.width || !duration) { return 0; }
      return clamp(((clientX - box.left) / box.width) * duration, 0, duration);
    }

    timeline.addEventListener("pointerdown", function (e) {
      if (e.target === handleA || e.target === handleB) { return; }
      if (!duration) { return; }
      audio.currentTime = timeAt(e.clientX);
      drawTime();
    });

    function dragHandle(handle, which) {
      handle.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        e.stopPropagation();
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener("pointermove", function (e) {
        if (!handle.hasPointerCapture(e.pointerId)) { return; }
        var t = timeAt(e.clientX);
        if (which === "a") {
          loopStart = Math.min(t, loopEnd - 0.3);
        } else {
          loopEnd = Math.max(t, loopStart + 0.3);
        }
        drawBand();
        drawTime();
      });

      handle.addEventListener("pointerup", function (e) {
        if (handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
        if (audio.currentTime < loopStart || audio.currentTime > loopEnd) {
          audio.currentTime = loopStart;
          drawTime();
        }
      });

      handle.addEventListener("keydown", function (e) {
        var step = e.shiftKey ? 5 : 1;
        if (e.key === "ArrowLeft") { step = -step; }
        else if (e.key !== "ArrowRight") { return; }
        e.preventDefault();
        if (which === "a") {
          loopStart = clamp(loopStart + step, 0, loopEnd - 0.3);
        } else {
          loopEnd = clamp(loopEnd + step, loopStart + 0.3, duration);
        }
        drawBand();
        drawTime();
      });
    }

    dragHandle(handleA, "a");
    dragHandle(handleB, "b");

    /* --- the section button --- */

    sectionBtn.addEventListener("click", function () {
      if (hasBand()) {
        loopStart = null;
        loopEnd = null;
        sectionBtn.setAttribute("aria-pressed", "false");
        sectionBtn.textContent = "Repeat part";
        audio.loop = repeat;
        drawBand();
        drawTime();
        return;
      }

      var here = audio.currentTime;
      var span = Math.min(10, Math.max(4, duration * 0.12));
      loopStart = clamp(here, 0, Math.max(0, duration - 1));
      loopEnd = clamp(loopStart + span, loopStart + 1, duration);
      if (loopEnd - loopStart < 1) {
        loopStart = clamp(loopEnd - span, 0, Math.max(0, loopEnd - 1));
      }

      audio.loop = false;
      sectionBtn.setAttribute("aria-pressed", "true");
      sectionBtn.textContent = "Clear";
      audio.currentTime = loopStart;
      drawBand();
      drawTime();

      var attempt = audio.play();
      if (attempt && attempt.catch) { attempt.catch(function () {}); }
    });

    players.push({
      audio: audio,
      refresh: function () {
        audio.playbackRate = speed;
        audio.loop = repeat && !hasBand();
      },
      redraw: function () {
        var box = timeline.getBoundingClientRect();
        if (Math.floor(box.width) === boxWidth) { return; }
        boxWidth = Math.floor(box.width);
        drawTime();
        drawBand();
      }
    });

    requestAnimationFrame(function () { drawTime(); });

    return row;
  }

  function viewableRow(file) {
    var row = document.createElement("div");
    row.className = "row row-file";

    var name = document.createElement("p");
    name.className = "file-name";
    name.textContent = file.name;
    row.appendChild(name);

    var btn = document.createElement("button");
    btn.className = "open-btn";
    btn.type = "button";
    btn.textContent = file.kind === "pdf" ? "Open sheet music" : "Open";
    btn.addEventListener("click", function () { openViewer(file); });
    row.appendChild(btn);

    return row;
  }

  var resizeWait = null;
  window.addEventListener("resize", function () {
    if (resizeWait) { clearTimeout(resizeWait); }
    resizeWait = setTimeout(function () {
      players.forEach(function (p) { p.redraw(); });
    }, 120);
  });

  /* ---------- render ---------- */

  function paint(children) {
    players.forEach(function (p) { p.audio.pause(); });
    players = [];
    panel.innerHTML = "";

    if (!children || !children.length) {
      showMessage("Nothing in here yet.", [
        "Drop the files into this folder in Drive and they'll appear after the next sync."
      ]);
      return;
    }

    var folders = [], audio = [], viewable = [];

    children.forEach(function (child) {
      if (child.type === "folder") { folders.push(child); }
      else if (child.kind === "audio") { audio.push(child); }
      else { viewable.push(child); }
    });

    folders.forEach(function (f) { panel.appendChild(folderRow(f)); });

    if (audio.length) { panel.appendChild(makeSettings()); }
    audio.forEach(function (f) { panel.appendChild(audioRow(f)); });
    viewable.forEach(function (f) { panel.appendChild(viewableRow(f)); });
  }

  function paintCrumbs() {
    crumbsBar.innerHTML = "";

    path.forEach(function (step, i) {
      if (i > 0) {
        var sep = document.createElement("span");
        sep.className = "crumb-sep";
        sep.textContent = "\u203A";
        sep.setAttribute("aria-hidden", "true");
        crumbsBar.appendChild(sep);
      }

      var btn = document.createElement("button");
      btn.className = "crumb";
      btn.type = "button";
      btn.textContent = step.name;

      if (i < path.length - 1) {
        btn.addEventListener("click", function () {
          path = path.slice(0, i + 1);
          render();
        });
      } else {
        btn.disabled = true;
      }

      crumbsBar.appendChild(btn);
    });
  }

  function render() {
    paintCrumbs();
    paint(path[path.length - 1].children);
  }

  /* ---------- choirs ---------- */

  function selectGroup(i) {
    closeViewer();

    var btns = groupsBar.querySelectorAll(".group-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-current", j === i ? "true" : "false");
    }

    path = [choirs[i]];
    render();
  }

  function buildGroupBar() {
    var index = 0;
    entries.forEach(function (entry) {
      if (entry === "divider") {
        var rule = document.createElement("span");
        rule.className = "group-divider";
        rule.setAttribute("aria-hidden", "true");
        groupsBar.appendChild(rule);
        return;
      }

      var i = index++;
      var btn = document.createElement("button");
      btn.className = "group-btn";
      btn.type = "button";
      btn.textContent = entry.name;
      btn.setAttribute("aria-current", "false");
      btn.addEventListener("click", function () { selectGroup(i); });
      groupsBar.appendChild(btn);
    });
  }

  /* ---------- start ---------- */

  fetch("manifest.json", { cache: "no-cache" }).then(function (res) {
    if (!res.ok) { throw new Error("no manifest"); }
    return res.json();
  }).then(function (data) {
    entries = data.choirs || [];
    choirs = entries.filter(function (e) { return e !== "divider"; });

    if (!choirs.length) {
      showMessage("No choirs are set up yet.", [
        "Add them to folders.json, then run the Sync from Drive job."
      ]);
      return;
    }

    if (data.generated) {
      stamp.textContent = "Updated " + new Date(data.generated).toLocaleString();
    }

    buildGroupBar();
    selectGroup(0);
  }).catch(function () {
    showMessage("The file list hasn't been built yet.", [
      "Go to the Actions tab and run \u201cSync from Drive\u201d.",
      "If it fails, check that DRIVE_API_KEY is saved in the repository secrets."
    ]);
  });
})();
</script>

</body>
</html>
