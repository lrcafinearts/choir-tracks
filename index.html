<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LRCA Choir Practice Tracks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Choir Tracks">

<!--
  Reads manifest.json, which the Drive sync writes. Nothing to configure here.
  To add or remove a choir, edit folders.json and re-run the sync.

  This is an audio tool. Students sing from their own marked-up paper music;
  sheet music is here to open when it's wanted, not to practise from.
-->

<style>
  :root {
    --cover:      #14332C;
    --cover-deep: #0E241F;
    --cover-line: #2E5348;
    --page:       #FFFFFF;
    --ink:        #16191A;
    --ink-soft:   #5C6360;
    --ink-faint:  #8B918E;
    --rule:       #E4E2DB;
    --quiet:      #93AAA3;
    --accent:     #0E6E7F;
    --marked:     #9B2F55;

    --serif: Palatino, "Palatino Linotype", "Book Antiqua", "URW Palladio L", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--cover); color: var(--ink);
    font-family: var(--sans); -webkit-text-size-adjust: 100%;
  }

  body { min-height: 100vh; padding: 0 0 4rem; }

  .masthead {
    background: var(--cover-deep);
    padding: 1.4rem 1.5rem 0;
    border-bottom: 1px solid var(--cover-line);
  }

  .masthead h1 {
    font-family: var(--serif); font-size: 1.3rem; font-weight: normal;
    letter-spacing: 0.05em; color: #F3F1EC; margin: 0;
  }

  .groups {
    display: flex; align-items: stretch; gap: 0.4rem;
    margin-top: 1.1rem; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }

  .groups::-webkit-scrollbar { display: none; }

  .group-btn {
    flex: 0 0 auto;
    font-family: var(--sans); font-size: 0.95rem; white-space: nowrap;
    color: #DDE6E2; background: transparent;
    border: 1px solid var(--cover-line); border-bottom: none;
    border-radius: 3px 3px 0 0;
    padding: 0.7rem 1rem; min-height: 44px; cursor: pointer;
  }

  .group-btn:hover { background: var(--cover-line); }

  .group-btn[aria-current="true"] {
    background: var(--page); border-color: var(--page);
    color: var(--ink); font-weight: 600;
  }

  .group-btn:focus-visible { outline: 2px solid #F3F1EC; outline-offset: -3px; }

  .group-divider {
    flex: 0 0 auto; width: 1px;
    background: var(--cover-line); margin: 0.4rem 0.6rem 0;
  }

  .shell { max-width: 760px; margin: 0 auto; padding: 0 1rem; }

  .crumbs {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 0.3rem; padding: 1rem 0.2rem; font-size: 0.9rem;
  }

  .crumb {
    font-family: var(--sans); font-size: 0.9rem;
    color: #DDE6E2; background: transparent; border: 0;
    padding: 0.3rem 0.1rem; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }

  .crumb:disabled { text-decoration: none; color: var(--quiet); cursor: default; }
  .crumb:focus-visible { outline: 2px solid #F3F1EC; outline-offset: 2px; }
  .crumb-sep { color: var(--cover-line); }

  .panel { background: var(--page); border-radius: 3px; padding: 0.4rem 1.4rem 1.2rem; }

  .row { border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: 0; }

  .row-folder {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; width: 100%;
    background: transparent; border: 0; cursor: pointer;
    font-family: var(--serif); font-size: 1.2rem; color: var(--ink);
    text-align: left; padding: 1.05rem 0.2rem; min-height: 56px;
  }

  .row-folder:hover { color: var(--accent); }
  .row-folder:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .row-chevron { color: var(--ink-faint); font-size: 1.3rem; flex: 0 0 auto; }

  .row-file { padding: 0.95rem 0.2rem; }

  .file-name {
    font-size: 0.95rem; color: var(--ink);
    margin: 0 0 0.5rem; word-break: break-word;
  }

  .row-file audio { width: 100%; height: 40px; display: block; }
  .file-note { font-size: 0.85rem; color: var(--ink-faint); margin: 0; }

  /* ---------- section looping ---------- */

  .loop-line {
    display: flex; align-items: center; gap: 0.6rem;
    flex-wrap: wrap; margin-top: 0.5rem;
  }

  .loop-btn {
    font-family: var(--sans); font-size: 0.85rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.45rem 0.75rem; min-height: 40px; cursor: pointer; white-space: nowrap;
  }

  .loop-btn:hover { border-color: var(--ink-soft); }

  .loop-btn[data-state="marking"] {
    border-color: var(--marked); color: var(--marked); font-weight: 600;
  }

  .loop-btn[data-state="looping"] {
    background: var(--marked); border-color: var(--marked); color: #FFFFFF;
  }

  .loop-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .loop-range {
    font-size: 0.85rem; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; margin: 0;
  }

  /* ---------- speed and repeat ---------- */

  .settings {
    display: flex; flex-wrap: wrap; gap: 1.4rem; align-items: center;
    padding: 0.9rem 0.2rem; border-bottom: 1px solid var(--rule);
  }

  .setting { display: flex; align-items: center; gap: 0.5rem; }
  .setting-label { font-size: 0.9rem; color: var(--ink-soft); }
  .speeds { display: flex; gap: 0.3rem; }

  .speed-btn, .repeat-btn {
    font-family: var(--sans); font-size: 0.9rem; color: var(--ink);
    background: transparent; border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.5rem 0.75rem; min-height: 44px; min-width: 48px; cursor: pointer;
  }

  .speed-btn:hover, .repeat-btn:hover { border-color: var(--ink-soft); }

  .speed-btn[aria-pressed="true"], .repeat-btn[aria-pressed="true"] {
    background: var(--ink); border-color: var(--ink); color: #FFF;
  }

  .speed-btn:focus-visible, .repeat-btn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  .open-btn {
    font-family: var(--sans); font-size: 0.9rem;
    color: var(--accent); background: transparent;
    border: 1px solid var(--rule); border-radius: 3px;
    padding: 0.55rem 0.9rem; min-height: 44px; cursor: pointer;
  }

  .open-btn:hover { border-color: var(--accent); }
  .open-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .msg {
    font-size: 0.95rem; color: var(--ink-soft); line-height: 1.55;
    margin: 0 0 0.6rem; padding: 0.8rem 0.2rem 0; max-width: 62ch;
  }

  .msg strong { color: var(--ink); font-weight: 600; }
  .msg-list { margin: 0.2rem 0 0.8rem; padding-left: 1.4rem; }
  .msg-list li { margin-bottom: 0.3rem; }

  .stamp {
    font-size: 0.8rem; color: var(--quiet);
    text-align: center; padding: 1.2rem 0 0; margin: 0;
  }

  .viewer {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 20, 17, 0.94);
    display: flex; flex-direction: column;
  }

  .viewer[hidden] { display: none; }

  .viewer-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem; padding: 0.8rem 1rem; border-bottom: 1px solid var(--cover-line);
  }

  .viewer-name {
    font-size: 0.95rem; color: #F3F1EC; margin: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .viewer-close {
    flex: 0 0 auto;
    font-family: var(--sans); font-size: 0.95rem; color: #F3F1EC;
    background: transparent; border: 1px solid var(--cover-line);
    border-radius: 3px; padding: 0.55rem 1rem; min-height: 44px; cursor: pointer;
  }

  .viewer-close:hover { background: var(--cover-line); }
  .viewer-close:focus-visible { outline: 2px solid #F3F1EC; outline-offset: 2px; }

  .viewer-body { flex: 1; overflow: auto; background: #FFFFFF; }
  .viewer-body iframe { width: 100%; height: 100%; border: 0; display: block; }
  .viewer-body img { width: 100%; height: auto; display: block; }

  @media (max-width: 700px) {
    .masthead { padding: 1.1rem 1rem 0; }
    .masthead h1 { font-size: 1.05rem; }
    .shell { padding: 0 0.75rem; }
    .panel { padding: 0.3rem 1rem 1rem; }
    .row-folder { font-size: 1.1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

<body>

<header class="masthead">
  <h1>LRCA CHOIR PRACTICE TRACKS</h1>
  <nav class="groups" id="groups" aria-label="Choirs"></nav>
</header>

<div class="shell">
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <main class="panel" id="panel" aria-live="polite"></main>
  <p class="stamp" id="stamp"></p>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Sheet music">
  <div class="viewer-bar">
    <p class="viewer-name" id="viewerName"></p>
    <button class="viewer-close" type="button" id="viewerClose">Close</button>
  </div>
  <div class="viewer-body" id="viewerBody"></div>
</div>

<script>
(function () {
  "use strict";

  var groupsBar = document.getElementById("groups");
  var crumbsBar = document.getElementById("crumbs");
  var panel = document.getElementById("panel");
  var stamp = document.getElementById("stamp");
  var viewer = document.getElementById("viewer");
  var viewerName = document.getElementById("viewerName");
  var viewerBody = document.getElementById("viewerBody");
  var viewerClose = document.getElementById("viewerClose");

  var entries = [];
  var choirs = [];
  var path = [];
  var speed = 1;
  var repeat = false;

  function clock(seconds) {
    if (!isFinite(seconds)) { return "0:00"; }
    var mins = Math.floor(seconds / 60);
    var secs = Math.floor(seconds % 60);
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
  }

  /* ---------- messages ---------- */

  function showMessage(headline, points) {
    panel.innerHTML = "";
    var p = document.createElement("p");
    p.className = "msg";
    var strong = document.createElement("strong");
    strong.textContent = headline;
    p.appendChild(strong);
    panel.appendChild(p);

    if (points && points.length) {
      var ul = document.createElement("ul");
      ul.className = "msg msg-list";
      points.forEach(function (t) {
        var li = document.createElement("li");
        li.textContent = t;
        ul.appendChild(li);
      });
      panel.appendChild(ul);
    }
  }

  /* ---------- sheet music viewer ---------- */

  function openViewer(file) {
    viewerName.textContent = file.name;
    viewerBody.innerHTML = "";

    if (file.kind === "image") {
      var img = document.createElement("img");
      img.src = file.path;
      img.alt = file.name;
      viewerBody.appendChild(img);
    } else {
      var frame = document.createElement("iframe");
      frame.src = file.path;
      frame.title = file.name;
      viewerBody.appendChild(frame);
    }

    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    viewerClose.focus();
  }

  function closeViewer() {
    viewer.hidden = true;
    viewerBody.innerHTML = "";
    document.body.style.overflow = "";
  }

  viewerClose.addEventListener("click", closeViewer);

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !viewer.hidden) { closeViewer(); }
  });

  /* ---------- speed and repeat ---------- */

  function applySettings() {
    var players = panel.querySelectorAll("audio");
    for (var i = 0; i < players.length; i++) {
      players[i].playbackRate = speed;
      /* A marked section wins over whole-track repeat. */
      players[i].loop = repeat && !players[i].dataset.section;
    }
  }

  function makeSettings() {
    var wrap = document.createElement("div");
    wrap.className = "settings";

    var speedSetting = document.createElement("div");
    speedSetting.className = "setting";

    var label = document.createElement("span");
    label.className = "setting-label";
    label.textContent = "Speed";
    speedSetting.appendChild(label);

    var speeds = document.createElement("div");
    speeds.className = "speeds";

    [[1, "Normal"], [0.85, "Slower"], [0.7, "Slowest"]].forEach(function (opt) {
      var b = document.createElement("button");
      b.className = "speed-btn";
      b.type = "button";
      b.textContent = opt[1];
      b.setAttribute("aria-pressed", speed === opt[0] ? "true" : "false");
      b.addEventListener("click", function () {
        speed = opt[0];
        var all = speeds.querySelectorAll(".speed-btn");
        for (var i = 0; i < all.length; i++) {
          all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
        }
        applySettings();
      });
      speeds.appendChild(b);
    });

    speedSetting.appendChild(speeds);
    wrap.appendChild(speedSetting);

    var repeatSetting = document.createElement("div");
    repeatSetting.className = "setting";

    var repeatBtn = document.createElement("button");
    repeatBtn.className = "repeat-btn";
    repeatBtn.type = "button";
    repeatBtn.textContent = "Repeat";
    repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
    repeatBtn.addEventListener("click", function () {
      repeat = !repeat;
      repeatBtn.setAttribute("aria-pressed", repeat ? "true" : "false");
      applySettings();
    });

    repeatSetting.appendChild(repeatBtn);
    wrap.appendChild(repeatSetting);

    return wrap;
  }

  /* ---------- rows ---------- */

  function folderRow(node) {
    var row = document.createElement("div");
    row.className = "row";

    var btn = document.createElement("button");
    btn.className = "row-folder";
    btn.type = "button";

    var name = document.createElement("span");
    name.textContent = node.name;
    btn.appendChild(name);

    var chev = document.createElement("span");
    chev.className = "row-chevron";
    chev.textContent = "\u203A";
    chev.setAttribute("aria-hidden", "true");
    btn.appendChild(chev);

    btn.addEventListener("click", function () {
      path.push(node);
      render();
    });

    row.appendChild(btn);
    return row;
  }

  function audioRow(file) {
    var row = document.createElement("div");
    row.className = "row row-file";

    var name = document.createElement("p");
    name.className = "file-name";
    name.textContent = file.name;
    row.appendChild(name);

    var audio = document.createElement("audio");
    audio.setAttribute("controls", "");
    audio.setAttribute("preload", "none");
    audio.src = file.path;

    audio.addEventListener("play", function () {
      var others = panel.querySelectorAll("audio");
      for (var i = 0; i < others.length; i++) {
        if (others[i] !== audio) { others[i].pause(); }
      }
      audio.playbackRate = speed;
    });

    audio.addEventListener("loadedmetadata", function () {
      audio.playbackRate = speed;
    });

    row.appendChild(audio);

    /* --- mark a section and loop just that --- */

    var start = null;
    var end = null;

    var line = document.createElement("div");
    line.className = "loop-line";

    var loopBtn = document.createElement("button");
    loopBtn.className = "loop-btn";
    loopBtn.type = "button";
    loopBtn.textContent = "Loop a section";
    loopBtn.dataset.state = "idle";

    var range = document.createElement("p");
    range.className = "loop-range";

    function clear() {
      start = null;
      end = null;
      delete audio.dataset.section;
      audio.loop = repeat;
      loopBtn.dataset.state = "idle";
      loopBtn.textContent = "Loop a section";
      range.textContent = "";
    }

    loopBtn.addEventListener("click", function () {
      if (start === null) {
        start = audio.currentTime;
        loopBtn.dataset.state = "marking";
        loopBtn.textContent = "Mark the end";
        range.textContent = "Starts at " + clock(start);
        return;
      }

      if (end === null) {
        end = audio.currentTime;
        if (end <= start) {
          var swap = start; start = end; end = swap;
        }
        /* Too small to be a phrase — they probably double-tapped. */
        if (end - start < 0.4) { clear(); return; }

        audio.dataset.section = "1";
        audio.loop = false;
        loopBtn.dataset.state = "looping";
        loopBtn.textContent = "Clear loop";
        range.textContent = clock(start) + " \u2013 " + clock(end);
        audio.currentTime = start;
        var attempt = audio.play();
        if (attempt && attempt.catch) { attempt.catch(function () {}); }
        return;
      }

      clear();
    });

    audio.addEventListener("timeupdate", function () {
      if (start === null || end === null) { return; }
      if (audio.currentTime >= end) { audio.currentTime = start; }
    });

    line.appendChild(loopBtn);
    line.appendChild(range);
    row.appendChild(line);

    return row;
  }

  function viewableRow(file) {
    var row = document.createElement("div");
    row.className = "row row-file";

    var name = document.createElement("p");
    name.className = "file-name";
    name.textContent = file.name;
    row.appendChild(name);

    var btn = document.createElement("button");
    btn.className = "open-btn";
    btn.type = "button";
    btn.textContent = file.kind === "pdf" ? "Open sheet music" : "Open";
    btn.addEventListener("click", function () { openViewer(file); });
    row.appendChild(btn);

    return row;
  }

  /* ---------- render ---------- */

  function paint(children) {
    panel.innerHTML = "";

    if (!children || !children.length) {
      showMessage("Nothing in here yet.", [
        "Drop the files into this folder in Drive and they'll appear after the next sync."
      ]);
      return;
    }

    var folders = [], audio = [], viewable = [];

    children.forEach(function (child) {
      if (child.type === "folder") { folders.push(child); }
      else if (child.kind === "audio") { audio.push(child); }
      else { viewable.push(child); }
    });

    folders.forEach(function (f) { panel.appendChild(folderRow(f)); });

    if (audio.length) { panel.appendChild(makeSettings()); }
    audio.forEach(function (f) { panel.appendChild(audioRow(f)); });
    viewable.forEach(function (f) { panel.appendChild(viewableRow(f)); });
  }

  function paintCrumbs() {
    crumbsBar.innerHTML = "";

    path.forEach(function (step, i) {
      if (i > 0) {
        var sep = document.createElement("span");
        sep.className = "crumb-sep";
        sep.textContent = "\u203A";
        sep.setAttribute("aria-hidden", "true");
        crumbsBar.appendChild(sep);
      }

      var btn = document.createElement("button");
      btn.className = "crumb";
      btn.type = "button";
      btn.textContent = step.name;

      if (i < path.length - 1) {
        btn.addEventListener("click", function () {
          path = path.slice(0, i + 1);
          render();
        });
      } else {
        btn.disabled = true;
      }

      crumbsBar.appendChild(btn);
    });
  }

  function render() {
    paintCrumbs();
    paint(path[path.length - 1].children);
  }

  /* ---------- choirs ---------- */

  function selectGroup(i) {
    closeViewer();

    var btns = groupsBar.querySelectorAll(".group-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].setAttribute("aria-current", j === i ? "true" : "false");
    }

    path = [choirs[i]];
    render();
  }

  function buildGroupBar() {
    var index = 0;
    entries.forEach(function (entry) {
      if (entry === "divider") {
        var rule = document.createElement("span");
        rule.className = "group-divider";
        rule.setAttribute("aria-hidden", "true");
        groupsBar.appendChild(rule);
        return;
      }

      var i = index++;
      var btn = document.createElement("button");
      btn.className = "group-btn";
      btn.type = "button";
      btn.textContent = entry.name;
      btn.setAttribute("aria-current", "false");
      btn.addEventListener("click", function () { selectGroup(i); });
      groupsBar.appendChild(btn);
    });
  }

  /* ---------- start ---------- */

  fetch("manifest.json", { cache: "no-cache" }).then(function (res) {
    if (!res.ok) { throw new Error("no manifest"); }
    return res.json();
  }).then(function (data) {
    entries = data.choirs || [];
    choirs = entries.filter(function (e) { return e !== "divider"; });

    if (!choirs.length) {
      showMessage("No choirs are set up yet.", [
        "Add them to folders.json, then run the Sync from Drive job."
      ]);
      return;
    }

    if (data.generated) {
      stamp.textContent = "Updated " + new Date(data.generated).toLocaleString();
    }

    buildGroupBar();
    selectGroup(0);
  }).catch(function () {
    showMessage("The file list hasn't been built yet.", [
      "Go to the Actions tab and run \u201cSync from Drive\u201d.",
      "If it fails, check that DRIVE_API_KEY is saved in the repository secrets."
    ]);
  });
})();
</script>

</body>
</html>
