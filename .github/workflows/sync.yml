name: Sync from Drive

on:
  # Times are UTC, and shift an hour against Little Rock at daylight saving.
  # GitHub runs scheduled jobs when it has capacity, so these are roughly
  # rather than exactly on time.
  schedule:
    # Every 10 minutes during the school day, Monday to Friday
    # (12:00-23:00 UTC is about 7am-6pm Central).
    - cron: "*/10 12-23 * * 1-5"
    # And a few times a day the rest of the time, to catch evening uploads.
    - cron: "37 1,5,9 * * *"
  # Adds a "Run workflow" button on the Actions tab for when you don't
  # want to wait — use this right after adding tracks before a rehearsal.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils

      - run: pip install requests

      - name: Pull files from Drive
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: python sync.py

      - name: Commit anything that changed
        run: |
          git config user.name "drive-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Sync from Drive"
            git push
          fi
